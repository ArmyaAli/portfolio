detail: >-
  Treat phone portrait and landscape as primary surfaces. Adapt the 3D content panels, camera
  framing, HUD/wordmark, intro, minimap, station buttons, and dialog bottom sheet for touch. Remove
  hover-only affordances, use 44px targets, respect safe-area insets, keep one-finger drag/tap
  navigation, and cap DPR/particles for mobile performance. Acceptance: 390x844, 430x932, and
  844x390 layouts have no horizontal overflow; panels and sheet text are readable;
  drag/tap/open/close/form/deep links work; no console errors; frame budget holds.
