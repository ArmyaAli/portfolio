detail: >-
  Auto tour is a user preference, not a transient run state. Opening a station pauses it; closing
  the sheet restarts the full countdown for that node and continues. Manual drag/wheel/key pauses
  and resumes after inactivity. Only the explicit Auto/Pause control turns it off. Progress bar
  hides while paused and restarts full. Acceptance: open/close resumes countdown; manual pause
  resumes; explicit off stays off; check/build/nix pass.
