detail: >-
  Add an Auto tour toggle that moves the fixed-Z camera station-to-station with a readable dwell
  time, plus a persistent Next node button. Auto must stop on manual drag/wheel/key input, disable
  when a station sheet opens, expose aria-pressed state, and work on mobile without overlapping the
  minimap or safe areas. Acceptance: desktop/mobile auto tour reaches all stations smoothly; next
  button focuses each node; manual input cancels auto; reduced motion remains usable; no frame or
  console regressions.
