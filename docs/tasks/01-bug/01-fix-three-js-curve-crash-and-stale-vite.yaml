detail: >-
  The interactive scene could crash in ResumeWorld.update with CatmullRomCurve3.getPoint reading x
  of undefined, and dev showed a 504 Outdated Optimize Dep. Switch the traveler to direct curve
  sampling, guard the decorative animation, clamp edge labels, remove debug instrumentation, and
  document the Vite cache reset. Acceptance: clean dev restart shows no 504/page errors; scene
  renders and moves; npm run check/build and nix build pass.
